services:
  traefik:
    image: traefik:v3.7.11
    container_name: traefik
    init: true
    restart: unless-stopped
    depends_on:
      authelia:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "4430-4450:4430-4450"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./assets/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic middleware directory - apps drop their files here
      - /etc/halos/traefik-dynamic.d:/etc/traefik/dynamic:ro
      # Generic routing declarations - read by prestart to generate labels
      - /etc/halos/routing.d:/etc/halos/routing.d:ro
      - ${CONTAINER_DATA_ROOT}/traefik/acme.json:/acme.json
      # Persistent self-signed TLS certificates
      - ${CONTAINER_DATA_ROOT}/traefik/certs:/certs:ro
    extra_hosts:
      # Required for host networking apps (Traefik routes to host IP)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - proxy
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  authelia:
    image: authelia/authelia:4.39.20
    container_name: authelia
    init: true
    restart: unless-stopped
    depends_on:
      authelia-valkey:
        condition: service_healthy
    volumes:
      - ${CONTAINER_DATA_ROOT}/authelia:/config
    environment:
      - TZ=${TZ:-UTC}
      # Load base configuration and OIDC clients (merged by Authelia)
      - X_AUTHELIA_CONFIG=/config/configuration.yml,/config/oidc-clients.yml
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 2s
      timeout: 3s
      start_period: 1s
      retries: 3
    networks:
      - proxy
      - authelia-internal
    labels:
      - traefik.enable=true
      # HTTP router (redirects to HTTPS) — path-only so any inbound Host reaches /sso/
      - traefik.http.routers.authelia.rule=PathPrefix(`/sso/`)
      - traefik.http.routers.authelia.entrypoints=web
      - traefik.http.routers.authelia.middlewares=redirect-to-https@file
      # HTTPS router — Authelia served under /sso/ path prefix on any reachable Host
      - traefik.http.routers.authelia-secure.rule=PathPrefix(`/sso/`)
      - traefik.http.routers.authelia-secure.entrypoints=websecure
      - traefik.http.routers.authelia-secure.tls=true
      - traefik.http.services.authelia.loadbalancer.server.port=9091
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  authelia-valkey:
    image: valkey/valkey:9.1.1-alpine
    container_name: authelia-valkey
    init: true
    restart: unless-stopped
    volumes:
      - ${CONTAINER_DATA_ROOT}/authelia/valkey:/data
    command: >-
      valkey-server
      --save ""
      --appendonly yes
      --requirepass "${REDIS_PASSWORD}"
      --loglevel warning
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - authelia-internal
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  homarr:
    image: ghcr.io/hatlabs/homarr:v1.60.0-halos.2
    container_name: homarr
    init: true
    restart: unless-stopped
    depends_on:
      - traefik
    entrypoint: ["/custom-entrypoint.sh"]
    command: ["bash", "run.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Allow Homarr to resolve HALOS_DOMAIN for OIDC (mDNS doesn't work in containers)
      - "${HALOS_DOMAIN}:host-gateway"
    environment:
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      # NEXTAUTH_URL is intentionally unset. With trustHost: true in the
      # Homarr fork's NextAuth config, the request's x-forwarded-host /
      # x-forwarded-proto determine the base URL per request. Setting
      # NEXTAUTH_URL forces next-auth's reqWithEnvURL() to override the
      # inbound Host with this canonical value, breaking multi-hostname
      # access — every post-login redirect lands on canonical regardless
      # of the originating host.
      # SECURITY: Disables TLS verification for ALL Node.js HTTPS requests.
      # Required for self-signed Traefik certs. Acceptable for local-only device.
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      # SSO/OIDC configuration (optional, set AUTH_PROVIDERS=oidc to enable)
      - AUTH_PROVIDERS=${AUTH_PROVIDERS:-}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_OIDC_ISSUER=${AUTH_OIDC_ISSUER}
      - AUTH_OIDC_CLIENT_ID=${AUTH_OIDC_CLIENT_ID:-}
      - AUTH_OIDC_CLIENT_SECRET=${AUTH_OIDC_CLIENT_SECRET:-}
      - AUTH_OIDC_CLIENT_NAME=${AUTH_OIDC_CLIENT_NAME:-}
      - AUTH_OIDC_SCOPE_OVERWRITE=${AUTH_OIDC_SCOPE_OVERWRITE:-}
      - AUTH_OIDC_FORCE_USERINFO=${AUTH_OIDC_FORCE_USERINFO:-}
      - AUTH_OIDC_ENABLE_DANGEROUS_ACCOUNT_LINKING=${AUTH_OIDC_ENABLE_DANGEROUS_ACCOUNT_LINKING:-}
      - AUTH_LOGOUT_REDIRECT_URL=${AUTH_LOGOUT_REDIRECT_URL}
      # Auto-redirect to OIDC provider on login page for seamless SSO
      - AUTH_OIDC_AUTO_LOGIN=true
      # Suppress external network requests (icon updates, analytics, update checks)
      - NO_EXTERNAL_CONNECTION=true
    ports:
      # Expose to localhost only for homarr-container-adapter
      - "127.0.0.1:7575:7575"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONTAINER_DATA_ROOT}/homarr/data:/appdata
      # Custom entrypoint that patches nginx to serve local assets
      - ./assets/homarr/custom-entrypoint.sh:/custom-entrypoint.sh:ro
      # Asset volumes (served via patched nginx)
      - /usr/share/pixmaps:/usr/share/pixmaps:ro
      - /usr/share/halos-homarr-branding:/usr/share/halos-homarr-branding:ro
      - /var/lib/container-apps:/var/lib/container-apps:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7575"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - proxy
    labels:
      - traefik.enable=true
      # HTTP router (redirects to HTTPS) — path-only catch-all on any inbound Host.
      # Explicit priority: 1 so /sso/, /cockpit/, and per-app paths win.
      - traefik.http.routers.homarr.rule=PathPrefix(`/`)
      - traefik.http.routers.homarr.entrypoints=web
      - traefik.http.routers.homarr.middlewares=redirect-to-https@file
      - traefik.http.routers.homarr.priority=1
      # HTTPS router — Homarr handles auth via OIDC (no ForwardAuth needed).
      # Path-only catch-all with explicit priority: 1 so higher-priority routers
      # (cockpit, per-app redirects) take precedence on their specific paths.
      - traefik.http.routers.homarr-secure.rule=PathPrefix(`/`)
      - traefik.http.routers.homarr-secure.entrypoints=websecure
      - traefik.http.routers.homarr-secure.tls=true
      - traefik.http.routers.homarr-secure.priority=1
      - traefik.http.services.homarr.loadbalancer.server.port=7575
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  ca-download:
    # Sidecar that publishes the active device CA at /ca/halos-ca.crt plus a
    # trust-install landing page at /ca/, so operators can install one trust
    # anchor for all services on this device.
    # Routed by Traefik (no host port published). prestart.sh copies the
    # active CA's PEM bytes into the mounted dir each run.
    #
    # busybox httpd (not nginx): the cert/profile endpoints are CGI scripts so
    # a completed download can record CA adoption (freezing the auto-CA's CN)
    # via an explicit sentinel write — a per-request side effect stock nginx
    # cannot express. Digest-pinned for reproducible deploys.
    image: busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
    container_name: ca-download
    init: true
    restart: unless-stopped
    # httpd: foreground (-f), plain :80 (Traefik fronts TLS), docroot /www,
    # config /etc/httpd.conf. -u drops to nobody after binding :80; the
    # adoption sentinel is chowned to 65534 so the CGI can rewrite it. Keep the
    # uid in sync with HALOS_CA_DOWNLOAD_UID in assets/lib-ca.sh.
    command: ["httpd", "-f", "-p", "80", "-u", "65534:65534", "-h", "/www", "-c", "/etc/httpd.conf"]
    volumes:
      # PACKAGE_NAME is normally injected by systemd via env.defaults
      # (debian/postinst writes it there). The :-halos-core-containers
      # fallback keeps `docker compose` invocations outside systemd (e.g.,
      # local dev with `docker compose config`) working with the canonical
      # path layout.
      - ${CONTAINER_DATA_ROOT}/${PACKAGE_NAME:-halos-core-containers}/certs/public:/srv:ro
      # Docroot: static landing under /www/ca plus the cert/profile/410 CGI
      # scripts at their public paths. Single read-only mount (busybox httpd
      # has no alias/rewrite, so the tree mirrors the URL space exactly).
      - ./assets/ca-download/www:/www:ro
      - ./assets/ca-download/httpd.conf:/etc/httpd.conf:ro
      # The single adoption sentinel, mounted as a FILE (not a directory)
      # read-write. The CGI rewrites only this one file in place; it cannot
      # create/delete anything else in certs/ca, and ca.key is never mounted.
      # The cert-manager (halos-manage-certs.service, ordered Before= this
      # stack) creates the file so Docker finds a regular file to bind here.
      - ${CONTAINER_DATA_ROOT}/${PACKAGE_NAME:-halos-core-containers}/certs/ca/adoption:/adoption:rw
    healthcheck:
      # Liveness only: a static /healthz, never the cert path. The former
      # cert-presence probe could only detect a missing cert, not fix it (the
      # cert is host-sourced, so an autoheal restart re-mounts the same missing
      # file in a loop) and made Traefik 3.7 drop the container so /ca/ fell
      # through to the homarr catch-all. A missing published cert is surfaced
      # by halos-manage-certs at ERROR in the journal instead. Liveness-only
      # also keeps the healthcheck off the cert CGI, so it cannot trip adoption.
      #
      # Connect via 127.0.0.1 (not localhost): httpd binds IPv4 :80 only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - proxy
    labels:
      - traefik.enable=true
      # HTTP — /ca/ prefix, the bare /ca (which the sidecar 308-redirects to
      # /ca/), plus the legacy /halos-ca.crt path (answered with a 410 +
      # canonical hint), redirected to HTTPS. Priority 200 beats homarr's
      # catch-all PathPrefix(`/`) at priority 1.
      - traefik.http.routers.ca-download-http.rule=PathPrefix(`/ca/`) || Path(`/ca`) || Path(`/halos-ca.crt`)
      - traefik.http.routers.ca-download-http.entrypoints=web
      - traefik.http.routers.ca-download-http.middlewares=redirect-to-https@file
      - traefik.http.routers.ca-download-http.priority=200
      # HTTPS — /ca/ prefix, the bare /ca (308-redirected to /ca/ by the
      # sidecar), plus the legacy /halos-ca.crt path. No ForwardAuth: this is
      # a public trust anchor; gating it would defeat the chicken-and-egg
      # bootstrap.
      - traefik.http.routers.ca-download-secure.rule=PathPrefix(`/ca/`) || Path(`/ca`) || Path(`/halos-ca.crt`)
      - traefik.http.routers.ca-download-secure.entrypoints=websecure
      - traefik.http.routers.ca-download-secure.tls=true
      - traefik.http.routers.ca-download-secure.priority=200
      - traefik.http.services.ca-download.loadbalancer.server.port=80
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: autoheal
    restart: unless-stopped
    network_mode: "none"
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

networks:
  proxy:
    name: halos-proxy-network
    driver: bridge
  authelia-internal:
    # Internal network for Authelia <-> Valkey communication only
    driver: bridge
    internal: true
