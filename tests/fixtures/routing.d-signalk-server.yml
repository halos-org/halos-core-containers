# Verbatim output of container-packaging-tools' generate_routing_yml for
# halos-marine-containers' signalk-server app. Regenerate it when that
# producer changes; the point of the fixture is that this consumer is
# tested against what the producer really emits, not against a hand-written
# guess at the format.
# Generic routing declaration for signalk-server
# Installed to /etc/halos/routing.d/signalk-server.yml
# Generated by container-packaging-tools
#
# This file is read by the reverse proxy at runtime to generate
# native routing configuration (e.g., Traefik labels).

app_id: signalk-server
package_name: marine-signalk-server-container
routing:
  backend:
    type: host
    service: signalk-server
    port: 3000
auth:
  mode: oidc
network:
  join_proxy_network: false
mdns:
- type: _signalk-wss._tcp
- type: _signalk-https._tcp
- type: _https._tcp
- type: _nmea-0183._tcp
  port: 10110
