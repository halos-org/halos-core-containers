# busybox httpd config for the ca-download sidecar.
#
# Replaces the former nginx:1.27-alpine config. busybox httpd is used (not
# nginx) because the cert/profile endpoints must run a deliberate per-request
# side effect — recording first external adoption of the CA — which stock
# nginx cannot express. httpd runs each matched endpoint as a CGI shell script.
#
# URL → docroot mapping is strict (busybox httpd has no alias/rewrite): the
# URL path is appended to the docroot (-h /www). So the served tree is laid
# out to match the public URL space exactly:
#   /ca/                       → /www/ca/index.html        (static landing)
#   /ca/halos-ca.crt           → /www/ca/halos-ca.crt      (CGI: cert + adopt)
#   /ca/halos-ca.mobileconfig  → /www/ca/halos-ca.mobileconfig (CGI: profile + adopt)
#   /halos-ca.crt              → /www/halos-ca.crt         (CGI: 410 Gone)
#   /healthz                   → /www/healthz              (static liveness)
#   /ca  (bare)                → 302 /ca/ (busybox-native dir redirect)
#
# The *.crt / *.mobileconfig suffix rules below route those paths through
# /bin/sh as CGI. Consequence: no STATIC .crt or .mobileconfig file may live
# in the docroot, or the suffix rule would try to execute it. The published CA
# bytes are served from a separate /srv mount that the CGIs cat — they are not
# in the docroot.
*.crt:/bin/sh
*.mobileconfig:/bin/sh

# MIME types for the static landing assets. busybox's built-in table is
# minimal; pin the ones the page uses so future CSS/JS/images serve correctly.
.html:text/html
.css:text/css
.js:application/javascript
.svg:image/svg+xml
.png:image/png
