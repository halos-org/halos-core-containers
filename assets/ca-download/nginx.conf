# nginx config for the ca-download sidecar.
#
# Serves the device CA-trust landing page and the active CA cert under /ca/.
# Traefik fronts TLS termination on :443 and routes the path here over the
# proxy network; this container listens on plain :80 only and is never
# exposed on the host.
#
# URL layout (the cert moved out from the bare /halos-ca.crt on 2026-05-28
# so the landing page and its assets share one path prefix):
#   /ca/                 → landing page (placeholder in Unit 1, real UI later)
#   /ca/halos-ca.crt     → active CA PEM, attachment (was /halos-ca.crt)
#   /ca/<asset>          → landing static assets (CSS/JS/screenshots)
#   /halos-ca.crt        → 410 Gone + canonical hint to the new path

worker_processes 1;

events {
    worker_connections 256;
}

http {
    # mime.types maps the landing assets (.html/.css/.js/.png) and .crt to
    # their correct Content-Type by extension; the per-location default_type
    # below only pins the cert as defense-in-depth.
    include       mime.types;
    default_type  application/octet-stream;
    access_log off;
    server_tokens off;

    server {
        listen 80 default_server;

        # /healthz is kept as a cheap liveness probe (no file I/O) for any
        # external monitoring that wants it. The docker healthcheck probes
        # /ca/halos-ca.crt instead so a missing/unreadable cert marks the
        # container unhealthy — see docker-compose.yml.
        location = /healthz {
            return 200 "ok\n";
        }

        # The active CA copy is bind-mounted at /srv/halos-ca.crt
        # (prestart.sh refreshes it from ${HALOS_CA_ACTIVE_CRT} each run).
        # `alias` (not `root`) pins the location to that exact file. Exact
        # match so it wins over the /ca/ landing prefix below.
        location = /ca/halos-ca.crt {
            alias /srv/halos-ca.crt;
            default_type application/x-x509-ca-cert;
            # `attachment` triggers the OS/browser cert-install dialog instead
            # of rendering the PEM as text.
            add_header Content-Disposition 'attachment; filename="halos-ca.crt"' always;
            # Defense-in-depth: if /srv/halos-ca.crt ever becomes a symlink
            # (e.g., a future prestart refactor sharing the serving-ca.crt
            # symlink pattern from lib-ca.sh), nginx must not follow it
            # outside the bind-mount.
            disable_symlinks on;
            # Read-only endpoint by design — refuse anything that isn't
            # GET/HEAD with a clean 405 + Allow header rather than silently
            # serving the file body for POST/PUT/DELETE.
            limit_except GET HEAD {
                deny all;
            }
        }

        # Apple Configuration Profile carrying the active CA, generated next to
        # halos-ca.crt by halos-manage-certs. Exact match so it wins over the
        # /ca/ landing prefix below.
        #
        # No Content-Disposition: attachment here (unlike the .crt). On iOS
        # Safari `attachment` routes the file to the Files app and the profile
        # installer never fires — the exact failure tracked in #169. Served
        # inline with the aspen MIME, Safari recognises it and shows the
        # "Profile Downloaded" install prompt instead.
        location = /ca/halos-ca.mobileconfig {
            alias /srv/halos-ca.mobileconfig;
            default_type application/x-apple-aspen-config;
            disable_symlinks on;
            limit_except GET HEAD {
                deny all;
            }
        }

        # Canonical trailing slash: a bare /ca redirects to /ca/. Without
        # this, /ca matches neither the prefix below nor the Traefik
        # PathPrefix(`/ca/`) rule, so it falls through to the homarr catch-all
        # and never reaches the landing page. The trailing slash also makes
        # the landing page's relative asset URLs (added in later units)
        # resolve under /ca/ rather than the site root. 308 preserves method
        # and is cacheable.
        location = /ca {
            # Emit a RELATIVE Location (/ca/). Traefik terminates TLS and
            # proxies plain http to this container, so nginx's default
            # absolute redirect would build `http://<host>/ca/` and bounce
            # the client down to http before Traefik's http→https redirect
            # catches it. A relative Location is resolved by the client
            # against the original https request, avoiding the downgrade hop.
            absolute_redirect off;
            return 308 /ca/;
        }

        # Landing page and its static assets, bind-mounted read-only at
        # /srv-landing (a sibling of /srv, not nested: /srv is itself a
        # read-only bind mount, so Docker can't create a /srv/landing
        # mountpoint inside it). Unit 1 ships only a placeholder index.html;
        # later units add the per-OS walkthrough UI, CSS/JS, and screenshots.
        location /ca/ {
            alias /srv-landing/;
            index index.html;
            disable_symlinks on;
            limit_except GET HEAD {
                deny all;
            }
        }

        # The cert lived here until 2026-05-28. 410 (Gone, not 404) plus a
        # canonical hint so clients holding the old URL discover the new path.
        location = /halos-ca.crt {
            add_header Link '</ca/halos-ca.crt>; rel="canonical"' always;
            return 410;
        }

        # Everything else: 404.
        location / {
            return 404;
        }
    }
}
