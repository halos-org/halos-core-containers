name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    uses: halos-org/shared-workflows/.github/workflows/pr-checks.yml@main
    with:
      # Branch protection requires the `checks / lintian` context, so this must
      # stay false or no PR on this repo can merge.
      skip-lintian: false
